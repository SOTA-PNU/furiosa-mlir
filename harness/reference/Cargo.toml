# Hand-written furiosa-opt crates: what the compiler should emit for each harness case.
# Each implements the harness crate contract (harness/README.md): a `run_graph` binary.
[workspace]
members = ["graph_io", "vector_add", "rmsnorm", "matmul", "embedding"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
eyre = "0.6"
furiosa-opt-std = "=0.10.0"
graph_io = { path = "graph_io" }
safetensors = "0.4"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# `cargo furiosa-opt` sets `--cfg backend="..."`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("emulation", "npu", "typecheck"))', 'cfg(furiosa_opt)'] }
