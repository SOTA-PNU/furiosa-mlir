[package]
name = "characterize"
version = "0.1.0"
edition = "2024"
publish = false
description = "Measures the Vector Engine's f32 unary functions on the device (harness/README.md)."

[package.metadata.furiosa-opt]

[lib]
path = "src/lib.rs"

[[bin]]
name = "characterize"
path = "src/main.rs"

[dependencies]
eyre = "0.6"
libm = "0.2"
furiosa-opt-std = "=0.10.0"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# `cargo furiosa-opt` sets `--cfg backend="..."`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("emulation", "npu", "typecheck"))', 'cfg(furiosa_opt)'] }

[workspace]
